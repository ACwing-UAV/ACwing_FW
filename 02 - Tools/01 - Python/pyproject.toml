[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acwing-tools"
version = "1.0.0"
description = "ACwing flight-controller PC tools: telemetry (USB/BLE), live attitude viewer, capture, magnetometer calibration, embedded-vs-reference IEKF comparison"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
ble = ["bleak>=0.22"]

[project.scripts]
acwing-tools = "acwing_tools.__main__:main"
iekf-tools = "acwing_tools.__main__:main"    # old name, kept as an alias

[tool.setuptools.packages.find]
include = ["acwing_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

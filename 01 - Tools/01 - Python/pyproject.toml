[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iekf-tools"
version = "1.0.0"
description = "Python tools for the STM32WB55 IEKF attitude firmware: telemetry, live viewer, capture, magnetometer calibration, embedded-vs-reference filter comparison"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
iekf-tools = "iekf_tools.__main__:main"

[tool.setuptools.packages.find]
include = ["iekf_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

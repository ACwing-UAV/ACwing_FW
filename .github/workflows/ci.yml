# Continuous integration: the test suites that keep firmware, app and PC tools
# in agreement on the protocol and on the flight behaviour.
#   firmware  host tests of 00 - FC_FW (flight core, AppTask, links, battery, log, IEKF, control loops, hover
#             estimate, RC input, position hold, GNSS input), ASan/UBSan; the 1-D design estimates of ADR 0011/0012;
#             the portable drivers include no HAL and no RTOS (ADR 0005)
#   firmware-target  cross-build of the STM32WB55 firmware with arm-none-eabi-gcc from the CubeIDE project
#             (.cproject include paths, defines and sources), Debug and Release on the bench board (90 % of RAM or
#             FLASH), and the rev A flight board (80 % of RAM)
#   app       ACwing Pilot: typecheck, unit tests (protocol, simulator, log decoder), production build
#   python    acwing_tools: log decoder (the reference of the app's), telemetry, filters
#   matlab    flight-log decoder and download client in GNU Octave (same tests as Python)
# Runs in UTC on purpose: tests must not depend on the developer's time zone.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: firmware host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build and run (gcc, AddressSanitizer + UBSan)
        working-directory: "00 - FC_FW/Tests/host"
        run: make
      - name: Portable drivers include no HAL and no RTOS (ADR 0005)
        working-directory: "00 - FC_FW/App/drivers"
        run: |
          if grep -rnE '#include *[<"](stm32|main\.h|cmsis_os|FreeRTOS|task\.h|queue\.h|semphr\.h)' .; then
            echo "a driver depends on the HAL or the RTOS: move the binding to bsp/"; exit 1
          fi
      - name: The control-law example of the docs compiles against ctl_api.h
        run: python3 "00 - FC_FW/Tests/host/doc_example.py"
      - name: Design estimates of the ADRs (flip, hand launch)
        working-directory: "00 - FC_FW/Tests/sim"
        run: |
          python3 flip_1d.py
          python3 launch_1d.py

  firmware-target:
    name: firmware target build (arm-none-eabi)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the ARM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: CubeMX project invariants (USB owned by the app, tick priority, TIM2 motor PWM, LF endings)
        working-directory: "00 - FC_FW"
        run: python3 Tests/target/check_cubemx.py
      - name: Debug (as STM32CubeIDE)
        working-directory: "00 - FC_FW"
        run: python3 Tests/target/build_fw.py --config Debug
      - name: Release
        working-directory: "00 - FC_FW"
        run: python3 Tests/target/build_fw.py --config Release
      - name: ACwing FC rev A (the flight board), tighter RAM budget
        # the bench build keeps the flight log in RAM (48 KB); rev A logs to the W25Q flash, so its RAM is the real
        # figure. 80 % leaves the boot / interrupt stack and room for the GPS work.
        working-directory: "00 - FC_FW"
        run: python3 Tests/target/build_fw.py --config Debug --define "APP_HW_REV='A'" --out revA --max-ram-pct 80
      - name: Motors enabled (bench and rev A), the PWM binding must link
        # MOTORS_ENABLE stays 0 in the sources until the power stage is connected; these builds keep the motor
        # outputs (bsp/motor_pwm.c, TIM2 from CubeMX) from rotting while it is off
        working-directory: "00 - FC_FW"
        run: |
          python3 Tests/target/build_fw.py --config Debug --define MOTORS_ENABLE=1 --out motors
          python3 Tests/target/build_fw.py --config Debug --define MOTORS_ENABLE=1 --define "APP_HW_REV='A'" --out motorsA --max-ram-pct 80

  app:
    name: app (typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "02 - Tools/02 - App"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: "02 - Tools/02 - App/.nvmrc"
          cache: npm
          cache-dependency-path: "02 - Tools/02 - App/package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: PC tools (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "02 - Tools/01 - Python"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "02 - Tools/01 - Python/pyproject.toml"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  matlab:
    name: MATLAB tools (Octave)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install GNU Octave
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends octave
      - name: Flight log decoder and download client
        working-directory: "02 - Tools/00 - Matlab/tests"
        run: octave --no-gui --quiet --eval "testFlightLog"
